# ECShop Play API — skeleton configuration.
play.http.secret.key = "changeme-dev-only-secret-ecshop-play-skeleton-0001"
play.http.secret.key = ${?APPLICATION_SECRET}

play.i18n.langs = ["zh-CN", "en"]

play.modules.enabled += "ecs.AppModule"

# Default development database: SQLite file under ./data (git-ignored).
# Export DB_DRIVER / DB_URL / DB_USER / DB_PASSWORD to switch to MySQL.
db.default.driver = "org.sqlite.JDBC"
db.default.driver = ${?DB_DRIVER}
db.default.url = "jdbc:sqlite:data/ecshop.sqlite3"
db.default.url = ${?DB_URL}
db.default.username = ${?DB_USER}
db.default.password = ${?DB_PASSWORD}
db.default.jndiName = "DefaultDS"

# Schema/seed bootstrap runs at app start (idempotent IF NOT EXISTS DDL).
play.evolutions.db.default.enabled = false
play.evolutions.db.default.autoApply = false

# Absolute root URL used by sitemap/feed (docs/03_api_contract.md).
site.base_url = "http://127.0.0.1:9000"
site.base_url = ${?SITE_BASE_URL}

# HMAC secret for /api/v1/payments/{provider}/callback (docs/03_api_contract.md).
payment.callback_hmac_secret = "dev-payment-callback-secret"
payment.callback_hmac_secret = ${?PAYMENT_CALLBACK_SECRET}

# Bootstrap DDL/seed resource paths per dialect (executed once at application start).
db.boot.sqlite.ddl = "sql/sqlite_boot.sql"
db.boot.sqlite.seed = "sql/sqlite_seed.sql"
db.boot.mysql.ddl = "sql/mysql_boot.sql"
db.boot.mysql.seed = "sql/mysql_seed.sql"

play.server.http.port = 9000
