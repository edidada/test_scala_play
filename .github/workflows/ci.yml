name: CI

# The build is the same on every branch: compile, then the contract and end-to-end suites.
# `third_party/shopex-ecshop` stays unchecked out — it is reference material for the port,
# and the tests only need SQLite, which ships inside the sqlite-jdbc dependency.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} · JDK ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [17, 21]

    # One shell everywhere, so the sbt command line stays identical on Windows.
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install sbt
        uses: sbt/setup-sbt@v1

      - name: Cache coursier, ivy and sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
            ~/AppData/Local/Coursier/Cache
            ~/AppData/Local/sbt
            ~/Library/Caches/Coursier
          key: ${{ runner.os }}-sbt-${{ matrix.java }}-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-${{ matrix.java }}-

      - name: Compile
        run: sbt -batch compile

      - name: Run the tests
        run: sbt -batch test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: target-tests-${{ matrix.os }}-jdk${{ matrix.java }}
          path: |
            target/test-reports/
            target/streams/
          retention-days: 7
          if-no-files-found: ignore
